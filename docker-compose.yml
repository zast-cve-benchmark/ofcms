services:
  mysql:
    image: mysql:5.7
    platform: linux/amd64
    environment:
      MYSQL_ROOT_PASSWORD: "12345678"
      MYSQL_DATABASE: "ofcms"
      MYSQL_CHARSET: "utf8"
      MYSQL_COLLATION: "utf8_general_ci"
    expose:
      - "3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./ofcms-admin/src/main/resources/conf/sql/install.sql:/docker-entrypoint-initdb.d/01_install.sql
    command: --character-set-server=utf8 --collation-server=utf8_general_ci --sql-mode=""
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p12345678"]
      interval: 5s
      timeout: 3s
      retries: 10

  ofcms:
    build:
      context: .
      dockerfile: Dockerfile
    platform: linux/amd64
    ports:
      - "8088:8080"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: "mysql"
      DB_PORT: "3306"
      DB_NAME: "ofcms"
      DB_USER: "root"
      DB_PASS: "12345678"

volumes:
  mysql_data:
